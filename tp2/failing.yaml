apiVersion: apps/v1
kind: Deployment
metadata:
  name: failing
  namespace: advanced-tp2
spec:
  selector:
    matchLabels:
      app: failing
  template:
    metadata:
      labels:
        app: failing
    spec:
      containers:
        - name: failing
          image: europe-west1-docker.pkg.dev/quatreapp/qsh-public/failing:1.0
          ports:
            - containerPort: 8080